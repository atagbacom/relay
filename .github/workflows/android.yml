name: Android

# Toute compilation se fait ici, jamais sur un poste de développement.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK de débogage et tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (JVM du démon Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Gradle avec cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK de débogage
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Taille des APK
        run: |
          {
            echo "## Taille des APK"
            echo
            echo "| APK | Taille |"
            echo "|---|---|"
            for apk in androidApp/build/outputs/apk/debug/*.apk; do
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
            done
            echo
            echo "Plus gros fichiers de l'APK universel :"
            echo '```'
            unzip -l androidApp/build/outputs/apk/debug/*universal*.apk | sort -k1 -n -r | head -12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tests unitaires
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Rapport des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: androidApp/build/reports/tests/
          if-no-files-found: ignore

      - name: APK à installer
        uses: actions/upload-artifact@v4
        with:
          name: relay-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # Les artefacts sont toujours zippés et demandent un compte GitHub :
      # l'APK de test d'une PR est aussi publié en pré-version, avec un lien
      # direct qui s'ouvre sur un téléphone. Même clé que les APK de test.
      - name: APK de test en lien direct
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITRE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TAG="essai-pr-$PR"
          cp androidApp/build/outputs/apk/debug/androidApp-universal-debug.apk relay-essai.apk
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" relay-essai.apk --prerelease --target "$SHA" \
            --title "Essai PR #$PR" \
            --notes "APK de test de la PR #$PR ($TITRE), commit ${SHA:0:7}. Clé de test : s'installe par-dessus les autres APK de test, pas par-dessus une version publiée. Ne pas diffuser."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/relay-essai.apk"
          echo "## APK de test : [relay-essai.apk]($URL)" >> "$GITHUB_STEP_SUMMARY"

  demarrage:
    name: Démarrage sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (JVM du démon Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Gradle avec cache
        uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compiler l'APK avec la version x86_64
        run: ./gradlew :androidApp:assembleDebug -Prelay.emulateur --stacktrace

      - name: Installer, lancer, vérifier
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/demarrage.sh

      - name: Journal Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-demarrage
          path: logcat.txt
          if-no-files-found: ignore

  reduite:
    name: Version réduite (R8) sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (JVM du démon Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Gradle avec cache
        uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Signée avec la clé de débogage : sert seulement à vérifier que R8 ne
      # casse rien (libsignal appelle du Java par son nom), jamais publiée
      - name: Compiler la version réduite avec la version x86_64
        run: ./gradlew :androidApp:assembleRelease -Prelay.emulateur --stacktrace

      - name: Installer, lancer, vérifier
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/demarrage.sh androidApp/build/outputs/apk/release/androidApp-universal-release.apk

      - name: Journal Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-version-reduite
          path: logcat.txt
          if-no-files-found: ignore

  captures:
    name: Captures d'écran de démonstration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (JVM du démon Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"

      - name: Gradle avec cache
        uses: gradle/actions/setup-gradle@v4

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compiler l'APK de test avec la version x86_64
        run: ./gradlew :androidApp:assembleDebug -Prelay.emulateur --stacktrace

      - name: Photographier chaque écran
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/captures.sh

      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: captures/
          if-no-files-found: ignore
